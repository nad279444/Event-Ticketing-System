name: Build and Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Values printed by scripts/gcp-setup.sh
  PROJECT_ID: event-ticket-511011
  PROJECT_NUMBER: 42472396685
  REGION: us-central1
  GAR_LOCATION: us-central1
  REPOSITORY: microservices

permissions:
  contents: read
  id-token: write # Required for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # === API Service ===
      - name: Build & Push API
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }} ./services/api
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: api-service
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          flags: |
            --service-account=api-runtime@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --allow-unauthenticated
            --set-env-vars=PROJECT_ID=${{ env.PROJECT_ID }}
            --set-secrets=DATABASE_URL=DATABASE_URL:latest

      # === Fulfillment Service ===
      - name: Build & Push Fulfillment
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/fulfillment:${{ github.sha }} ./services/fulfillment
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/fulfillment:${{ github.sha }}

      - name: Deploy Fulfillment to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: fulfillment-service
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/fulfillment:${{ github.sha }}
          flags: |
            --service-account=fulfillment-runtime@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --set-env-vars=PROJECT_ID=${{ env.PROJECT_ID }}

      # === Analytics Service ===
      - name: Build & Push Analytics
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/analytics:${{ github.sha }} ./services/analytics
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/analytics:${{ github.sha }}

      - name: Deploy Analytics to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: analytics-service
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/analytics:${{ github.sha }}
          flags: |
            --service-account=analytics-runtime@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --allow-unauthenticated
            --set-env-vars=PROJECT_ID=${{ env.PROJECT_ID }}
            --set-secrets=DATABASE_URL=DATABASE_URL:latest

      # === Pub/Sub push subscriptions ===
      - name: Configure Pub/Sub push subscriptions
        run: bash ./scripts/gcp-subscriptions.sh
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
